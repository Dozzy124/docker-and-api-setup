version: "3.9"

services:
  # ---------------------------------------------------------------------
  # PHP-FPM (Laravel, API-only)
  # ---------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: medai-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=medai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medai

  # ---------------------------------------------------------------------
  # Nginx — reverse proxy in front of php-fpm (JSON API only, no Blade)
  # ---------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: medai-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - medai

  # ---------------------------------------------------------------------
  # Laravel Horizon — queue worker dashboard (Redis-backed queues)
  # Runs in the same image as `app`, just a different command.
  # ---------------------------------------------------------------------
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: medai-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medai

  # ---------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: medai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-medai}
      POSTGRES_USER: ${DB_USERNAME:-medai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - medai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-medai} -d ${DB_DATABASE:-medai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medai

  # ---------------------------------------------------------------------
  # Redis (cache, queues, Horizon, broadcasting)
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: medai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - medai-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medai

  # ---------------------------------------------------------------------
  # Mailhog — catches outgoing emails in local dev (register/reset-password)
  # ---------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: medai-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - medai

networks:
  medai:
    driver: bridge

volumes:
  medai-pgdata:
  medai-redisdata:
